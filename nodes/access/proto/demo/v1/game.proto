// 认证只签发凭据，不建立游戏登录；密码不复用到 Token 登录协议。
message PasswordAuthRequest {
  string username = 1;
  string password = 2;
}
message PasswordAuthResponse {
  uint64 user_id = 1;
  string access_token = 2;
  int64 expires_at_ms = 3;
}
message LoginRequest {
  reserved 1, 2;
  reserved "username", "password";
  string access_token = 3;
}
message LoginResponse {
  uint64 user_id = 1;
}
message EnterRequest {}
message EnterResponse {
  Snapshot snapshot = 1;
  Balance silver = 2;
}
message HitRequest {
  string action_id = 1;
  uint64 spawn_seq = 2;
  int64 hole = 3;
}
message HitResponse {
  Hit hit = 1;
  Balance silver = 2;
  // target_unavailable 表示目标已失效且未记账，此时不携带 hit/silver。
  string rejection = 3;
}
message SnapshotRequest {}
message SnapshotResponse {
  Snapshot snapshot = 1;
}
message LeaveRequest {}
message LeaveResponse {
  bool left = 1;
}
message OperationRequest {
  string hit_id = 1;
}
message OperationResponse {
  bool found = 1;
  string hit_id = 2;
  string status = 3;
  string reason = 4;
}
message SnapshotPush {
  Snapshot snapshot = 1;
}
message BalancePush {
  Balance silver = 1;
}

// 银子和版本使用 64 位整数；TypeScript 端使用 bigint。
message Balance {
  int64 balance = 1;
  ConfirmedSilver confirmed = 2;
  int64 available = 3;
  reserved 4;
  uint64 revision = 5;
}
// 确认金额与数据库版本一起出现；即时命中可以不携带此消息。
message ConfirmedSilver {
  int64 amount = 1;
  uint64 version = 2;
}
message Member {
  uint64 user_id = 1;
  int64 seat = 2;
}
message Target {
  uint64 spawn_seq = 1;
  int64 hole = 2;
  int64 deadline_ms = 3;
  bool claimed = 4;
}
message Hit {
  string hit_id = 1;
  string action_id = 2;
  string status = 3;
  int64 debit = 4;
  int64 credit = 5;
  uint64 spawn_seq = 6;
  int64 hole = 7;
}
message Snapshot {
  string attack_name = 1;
  int64 server_ms = 2;
  int64 seat = 3;
  repeated Member members = 4;
  repeated Target targets = 5;
  repeated Hit hits = 6;
}


// 斗地主使用独立消息，不改变地鼠客户端协议；空出牌列表表示不出。
message LandlordEnterRequest {}
message LandlordReadyRequest {}
message LandlordPlayRequest { uint64 turn = 1; repeated int64 cards = 2; }
message LandlordSnapshotRequest {}
message LandlordLeaveRequest {}
message LandlordOperationRequest { string operation_id = 1; }
message LandlordOperationResponse {
 bool found = 1;
 string operation_id = 2;
 string status = 3;
 string reason = 4;
}
message LandlordEnterResponse { LandlordSnapshot snapshot = 1; }
message LandlordReadyResponse { LandlordSnapshot snapshot = 1; }
message LandlordPlayResponse { LandlordSnapshot snapshot = 1; }
message LandlordSnapshotResponse { LandlordSnapshot snapshot = 1; }
message LandlordLeaveResponse { LandlordSnapshot snapshot = 1; }
message LandlordCallResponse { LandlordSnapshot snapshot = 1; }
message LandlordRobResponse { LandlordSnapshot snapshot = 1; }
message LandlordPush { LandlordSnapshot snapshot = 1; }
message LandlordCallRequest {uint64 turn=1; bool yes=2;}
message LandlordRobRequest {uint64 turn=1; bool yes=2;}
message LandlordPlayer {
 uint64 user_id = 1;
 int64 seat = 2;
 bool ready = 3;
 int64 remaining = 4;
 int64 call_choice=5;
 int64 rob_choice=6;
}
message LandlordSettlement {
 string operation_id = 1;
 string status = 2;
 string reason = 3;
 int64 debit = 4;
 int64 credit = 5;
 int64 balance = 6;
 uint64 version = 7;
}
message LandlordSnapshot {
 string room_name = 1;
 string phase = 2;
 int64 seat = 3;
 repeated LandlordPlayer players = 4;
 repeated int64 hand = 5;
 repeated int64 bottom = 6;
 repeated int64 last_cards = 7;
 int64 last_seat = 8;
 int64 turn_seat = 9;
 uint64 turn = 10;
 int64 deadline_ms = 11;
 int64 landlord_seat = 12;
 int64 winner_seat = 13;
 LandlordSettlement settlement = 14;
 int64 multiplier=15;
 int64 candidate_seat=16;
 int64 redeals=17;
}
