syntax = "proto3";
package demo.v1;

import "gsr/protocol/v1/options.proto";

option go_package = "github.com/cnooljaw/gsrdemo/nodes/access/gen/demo/v1;demopb";

// 客户端业务编号独立于内部 Cluster CommandID。
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;

  // 通用成功响应，使用原 request_id。
  S2C_ACTION_ACK = 1005 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.ActionAck"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];

  // 认证与登录。
  C2S_PASSWORD_AUTH = 1003 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.PasswordAuthRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_PASSWORD_AUTH = 1004 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.PasswordAuthResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_LOGIN = 1001 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LoginRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_LOGIN = 1002 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LoginResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];

  // 地鼠请求与响应。
  C2S_ENTER = 1011 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.EnterRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_ENTER = 1012 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.EnterResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_HIT = 1021 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.HitRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_HIT = 1022 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.HitResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_SNAPSHOT = 1031 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.SnapshotRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_SNAPSHOT = 1032 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.SnapshotResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_LEAVE = 1041 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LeaveRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];

  // 地鼠推送。
  S2C_SNAPSHOT_PUSH = 1061 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.SnapshotPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_BALANCE_PUSH = 1062 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.BalancePush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];

  // 斗地主请求与响应。
  C2S_LANDLORD_ENTER = 1101 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordEnterRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_LANDLORD_ENTER = 1102 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordEnterResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_LANDLORD_READY = 1111 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordReadyRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_LANDLORD_CALL = 1171 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordCallRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_LANDLORD_ROB = 1181 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordRobRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_LANDLORD_PLAY = 1121 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordPlayRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_LANDLORD_TRUSTEE = 1201 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordTrusteeRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_LANDLORD_SNAPSHOT = 1131 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordSnapshotRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_LANDLORD_SNAPSHOT = 1132 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordSnapshotResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_LANDLORD_LEAVE = 1141 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordLeaveRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];

  // 斗地主牌桌事件。
  S2C_LANDLORD_SEAT_PUSH = 1191 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordSeatPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_READY_PUSH = 1192 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordReadyPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_DEAL_PUSH = 1193 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordDealPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_BID_PUSH = 1194 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordBidPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_PLAY_PUSH = 1195 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordPlayPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_SETTLEMENT_PUSH = 1196 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordSettlementPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_TRUSTEE_PUSH = 1197 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordTrusteePush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_LANDLORD_TURN_PUSH = 1198 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.LandlordTurnPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];

  // 定海麻将进桌、准备、恢复和离桌。
  C2S_DHMJ_ENTER = 1301 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjEnterRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_DHMJ_ENTER = 1302 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjEnterResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_DHMJ_READY = 1311 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjReadyRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  C2S_DHMJ_SNAPSHOT = 1321 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjSnapshotRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_DHMJ_SNAPSHOT = 1322 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjSnapshotResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_DHMJ_LEAVE = 1331 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.v1.DhmjLeaveRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
}

message ActionAck {}

// 认证只签发凭据，不建立游戏登录；密码不复用到 Token 登录协议。
message PasswordAuthRequest {
  string username = 1;
  string password = 2;
}
message PasswordAuthResponse {
  uint64 user_id = 1;
  string access_token = 2;
  int64 expires_at_ms = 3;
}
message LoginRequest {
  string access_token = 1;
}
message LoginResponse {
  uint64 user_id = 1;
}

// 地鼠请求、响应与推送。
message EnterRequest {}
message EnterResponse {
  Snapshot snapshot = 1;
  Balance silver = 2;
}
message HitRequest {
  string action_id = 1;
  uint64 spawn_seq = 2;
  int64 hole = 3;
}
message HitResponse {
  Hit hit = 1;
  Balance silver = 2;
  // target_unavailable 表示目标已失效且未记账，此时不携带 hit/silver。
  string rejection = 3;
}
message SnapshotRequest {}
message SnapshotResponse {
  Snapshot snapshot = 1;
}
message LeaveRequest {}
message SnapshotPush {
  Snapshot snapshot = 1;
}
message BalancePush {
  Balance silver = 1;
}

// 银子和版本使用 64 位整数；TypeScript 端使用 bigint。
message Balance {
  int64 balance = 1;
  ConfirmedSilver confirmed = 2;
  int64 available = 3;
  uint64 revision = 4;
}
// 确认金额与数据库版本一起出现；即时命中可以不携带此消息。
message ConfirmedSilver {
  int64 amount = 1;
  uint64 version = 2;
}
message Member {
  uint64 user_id = 1;
  int64 seat = 2;
}
message Target {
  uint64 spawn_seq = 1;
  int64 hole = 2;
  int64 deadline_ms = 3;
  bool claimed = 4;
}
message Hit {
  string hit_id = 1;
  string action_id = 2;
  string status = 3;
  int64 debit = 4;
  int64 credit = 5;
  uint64 spawn_seq = 6;
  int64 hole = 7;
}
message Snapshot {
  string attack_name = 1;
  int64 server_ms = 2;
  int64 seat = 3;
  repeated Member members = 4;
  repeated Target targets = 5;
  repeated Hit hits = 6;
}

// 斗地主请求与响应。
message LandlordEnterRequest {}

message LandlordEnterResponse {
  LandlordSnapshot snapshot = 1;
}

message LandlordReadyRequest {}

message LandlordCallRequest {
  uint64 turn = 1;
  bool yes = 2;
}

message LandlordRobRequest {
  uint64 turn = 1;
  bool yes = 2;
}

message LandlordPlayRequest {
  uint64 turn = 1;
  // 空列表表示不出。
  repeated int64 cards = 2;
}

message LandlordTrusteeRequest {
  bool enabled = 1;
}

message LandlordSnapshotRequest {}

message LandlordSnapshotResponse {
  LandlordSnapshot snapshot = 1;
}

message LandlordLeaveRequest {}

// 斗地主快照与局末结算。
message LandlordSnapshot {
  string room_name = 1;
  string phase = 2;
  int64 seat = 3;
  repeated LandlordPlayer players = 4;
  repeated int64 hand = 5;
  repeated int64 bottom = 6;
  repeated int64 last_cards = 7;
  int64 last_seat = 8;
  int64 turn_seat = 9;
  uint64 turn = 10;
  int64 deadline_ms = 11;
  int64 landlord_seat = 12;
  int64 winner_seat = 13;
  LandlordSettlement settlement = 14;
  int64 multiplier = 15;
  int64 candidate_seat = 16;
  int64 redeals = 17;
  uint64 revision = 18;
  int64 server_ms = 19;
  int64 start_ms = 20;
  bool can_act = 21;
}

message LandlordPlayer {
  uint64 user_id = 1;
  int64 seat = 2;
  bool ready = 3;
  int64 remaining = 4;
  int64 call_choice = 5;
  int64 rob_choice = 6;
  bool trustee = 7;
}

message LandlordSettlement {
  string operation_id = 1;
  string status = 2;
  string reason = 3;
  int64 debit = 4;
  int64 credit = 5;
  int64 balance = 6;
  uint64 version = 7;
}

// 牌桌事件的 revision 在同一牌桌内递增；发牌与结算内容按接收者分别生成。
message LandlordSeatPush {
  string room_name = 1;
  uint64 revision = 2;
  uint64 user_id = 3;
  int64 seat = 4;
  bool joined = 5;
  bool ready = 6;
}

message LandlordReadyPush {
  string room_name = 1;
  uint64 revision = 2;
  uint64 user_id = 3;
  int64 seat = 4;
  bool ready = 5;
}

message LandlordDealPush {
  string room_name = 1;
  uint64 revision = 2;
  repeated int64 hand = 3;
  uint64 turn = 4;
  int64 turn_seat = 5;
  int64 deadline_ms = 6;
  int64 redeals = 7;
  int64 server_ms = 8;
  int64 start_ms = 9;
}

message LandlordBidPush {
  string room_name = 1;
  uint64 revision = 2;
  uint64 user_id = 3;
  bool rob = 4;
  bool yes = 5;
  string phase = 6;
  uint64 turn = 7;
  int64 turn_seat = 8;
  int64 deadline_ms = 9;
  int64 candidate_seat = 10;
  int64 landlord_seat = 11;
  int64 multiplier = 12;
  repeated int64 bottom = 13;
  bool redealt = 14;
  int64 server_ms = 15;
  int64 start_ms = 16;
  bool can_act = 17;
}

message LandlordPlayPush {
  string room_name = 1;
  uint64 revision = 2;
  uint64 user_id = 3;
  repeated int64 cards = 4;
  int64 remaining = 5;
  string phase = 6;
  uint64 turn = 7;
  int64 turn_seat = 8;
  int64 deadline_ms = 9;
  repeated int64 last_cards = 10;
  int64 last_seat = 11;
  int64 winner_seat = 12;
  int64 multiplier = 13;
  int64 server_ms = 14;
  int64 start_ms = 15;
  bool can_act = 16;
}

message LandlordSettlementPush {
  string room_name = 1;
  uint64 revision = 2;
  LandlordSettlement settlement = 3;
}

message LandlordTrusteePush {
  string room_name = 1;
  uint64 revision = 2;
  uint64 user_id = 3;
  bool trustee = 4;
  int64 deadline_ms = 5;
  int64 server_ms = 6;
  int64 start_ms = 7;
}

message LandlordTurnPush {
  string room_name = 1;
  uint64 revision = 2;
  string phase = 3;
  uint64 turn = 4;
  int64 turn_seat = 5;
  int64 deadline_ms = 6;
  int64 server_ms = 7;
}


message DhmjEnterRequest {}

message DhmjEnterResponse {
  DhmjSnapshot snapshot = 1;
}

message DhmjReadyRequest {}

message DhmjSnapshotRequest {}

message DhmjSnapshotResponse {
  DhmjSnapshot snapshot = 1;
}

message DhmjLeaveRequest {}

message DhmjSnapshot {
  string table_name = 1;
  int64 seat = 2;
  string phase = 3;
  repeated DhmjPlayer players = 4;
  repeated int64 hand = 5;
  repeated DhmjDiscards discards = 6;
  repeated int64 hand_counts = 7;
  repeated bool trustees = 8;
  int64 active_seat = 9;
  uint64 turn = 10;
  uint64 window_id = 11;
  int64 window_tile = 12;
  repeated int64 offers = 13;
  bool self_action = 14;
  bool can_self_win = 15;
  repeated int64 concealed_kongs = 16;
  repeated int64 added_kongs = 17;
  int64 server_ms = 18;
  int64 deadline_ms = 19;
  DhmjSettlement settlement = 20;
}

message DhmjPlayer {
  uint64 user_id = 1;
  int64 seat = 2;
  bool ready = 3;
}

message DhmjDiscards {
  repeated int64 tiles = 1;
}

message DhmjSettlement {
  string operation_id = 1;
  string status = 2;
  uint64 user_id = 3;
  int64 fee = 4;
  int64 paid = 5;
  int64 received = 6;
  int64 balance = 7;
  uint64 version = 8;
}
