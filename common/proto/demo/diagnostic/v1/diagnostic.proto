syntax = "proto3";
package demo.diagnostic.v1;
option go_package = "github.com/cnooljaw/gsrdemo/common/gen/demo/diagnostic/v1;diagnosticpb";
import "gsr/protocol/v1/options.proto";

// MsgId 只用于工程通信验收，不表示认证、玩法或到账成功。
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;
  C2S_PROBE_REQUEST = 1001 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.diagnostic.v1.ProbeRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_PROBE_RESPONSE = 1002 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.diagnostic.v1.ProbeResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  S2C_PROBE_PUSH = 1003 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.diagnostic.v1.ProbePush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
}

// ProbeRequest 发起一次有限的节点探测。
message ProbeRequest { string operation_id = 1; string text = 2; }
// ProbeResponse 描述逐节点 Call 结果，不保证 Send 推送送达。
message ProbeResponse {
  string operation_id = 1;
  string text = 2;
  string code = 3;
  string failed_node = 4;
  repeated string nodes = 5;
}
// ProbePush 是 mole 经 Cluster Send 返回当前 Agent 的主动通知。
message ProbePush { string operation_id = 1; string text = 2; string node = 3; }
// NodeProbeRequest 是内部 Protobuf bytes；连接私有推送路由由 access 填写。
message NodeProbeRequest {
  ProbeRequest probe = 1;
  string access_node = 2;
  string agent_name = 3;
  string agent_token = 4;
}
// NodeProbeResponse 是某个节点完成探测后的编码结果。
message NodeProbeResponse { string operation_id = 1; string text = 2; string node = 3; }
// AgentProbePush 带连接私有令牌，避免旧连接通知改变新连接。
message AgentProbePush { ProbePush push = 1; string agent_token = 2; }
