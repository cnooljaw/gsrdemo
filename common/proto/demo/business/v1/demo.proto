syntax = "proto3";
package demo.business.v1;

import "gsr/protocol/v1/options.proto";

option go_package = "github.com/cnooljaw/gsrdemo/common/gen/demo/business/v1;businesspb";

// 当前客户端业务协议集中在一处，后续按实际调用拆分。
enum MsgId {
  MSG_ID_UNSPECIFIED = 0;
  C2S_PASSWORD_LOGIN = 1101 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.PasswordLoginRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_PASSWORD_LOGIN = 1102 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.PasswordLoginResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_QUERY_SESSION = 1111 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.QuerySessionRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_QUERY_SESSION = 1112 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.QuerySessionResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_QUERY_OPERATION = 1121 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.QueryOperationRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_QUERY_OPERATION = 1122 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.QueryOperationResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_ENTER_MOLE = 1201 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.EnterMoleRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_ENTER_MOLE = 1202 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.EnterMoleResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_LEAVE_ROOM = 1211 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.LeaveRoomRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_LEAVE_ROOM = 1212 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.LeaveRoomResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_MOLE_SNAPSHOT = 1301 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.MoleSnapshotRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_MOLE_SNAPSHOT = 1302 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.MoleSnapshotResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  C2S_MOLE_HIT = 1311 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.MoleHitRequest"
    direction: DIRECTION_CLIENT_TO_SERVER
    kind: KIND_REQUEST
  }];
  S2C_MOLE_HIT = 1312 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.MoleHitResponse"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_RESPONSE
  }];
  S2C_MOLE_STATE = 1391 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.MoleStatePush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
  S2C_SESSION_REPLACED = 1191 [(gsr.protocol.v1.message_route) = {
    payload_type: ".demo.business.v1.SessionReplacedPush"
    direction: DIRECTION_SERVER_TO_CLIENT
    kind: KIND_PUSH
  }];
}

message SessionView {
  string user_id = 1;
  string location = 2;
  uint64 location_version = 3;
  string game_kind = 4;
  string room_id = 5;
  string round_id = 6;
  string room_phase = 7;
  uint64 room_state_version = 8;
  string pending_operation_id = 9;
  repeated uint32 allowed_msg_ids = 10;
}
message MemberView {
  string user_id = 1;
  uint32 seat = 2;
  bool connected = 3;
  int64 score = 4;
}
message MoleTarget {
  uint64 instance_id = 1;
  uint32 hole = 2;
  int64 opens_at_ms = 3;
  int64 closes_at_ms = 4;
}
message PlayerDelta {
  string user_id = 1;
  int64 delta = 2;
}
message RoundResult {
  string settlement_id = 1;
  repeated PlayerDelta deltas = 2;
  string progress = 3;
}
message MoleSnapshot {
  string room_id = 1;
  string round_id = 2;
  string phase = 3;
  uint64 state_version = 4;
  repeated MemberView members = 5;
  MoleTarget target = 6;
  int64 ends_at_ms = 7;
  RoundResult result = 8;
}
message PositionResult {
  string code = 1;
  string operation_id = 2;
  SessionView session = 3;
  MoleSnapshot snapshot = 4;
  bool refreshed = 5;
}
message PasswordLoginRequest {
  string operation_id = 1;
  string username = 2;
  string password = 3;
}
message PasswordLoginResponse {
  PositionResult result = 1;
}
message QuerySessionRequest {}
message QuerySessionResponse {
  PositionResult result = 1;
}
message QueryOperationRequest {
  string operation_id = 1;
}
message QueryOperationResponse {
  PositionResult result = 1;
}
message EnterMoleRequest {
  string operation_id = 1;
}
message EnterMoleResponse {
  PositionResult result = 1;
}
message LeaveRoomRequest {
  string operation_id = 1;
  string room_id = 2;
}
message LeaveRoomResponse {
  PositionResult result = 1;
}
message MoleSnapshotRequest {}
message MoleSnapshotResponse {
  string code = 1;
  MoleSnapshot snapshot = 2;
}
message MoleHitRequest {
  string operation_id = 1;
  string room_id = 2;
  string round_id = 3;
  uint64 instance_id = 4;
}
message MoleHitResponse {
  string code = 1;
  string operation_id = 2;
  MoleSnapshot snapshot = 3;
}
message MoleStatePush {
  MoleSnapshot snapshot = 1;
}
message SessionReplacedPush {}
