# 用途：独立压测库的持久历史造数和分档测试；不连接日常示例库。
mysql_config: settlement-load.local.yaml
dataset_id: history-v1
wallets: 1000000
mole_batch_size: 300
# 游戏操作数；每个钱包另有一笔初始化操作/批次，不混入此数。
stages: [1024000, 10000000, 50000000, 100000000]
# 自然档位完成后追加真实的单项小批次操作，使总批次数达到这些档位。
# 不重写已有历史，因此总游戏操作会略高于 1 亿；报告记录实际数量。
batch_stages: [10000000, 30000000]
load_seconds: 60
